markdown: kramdown
theme: null
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - .git
  - .gitignore
  - README.md
  - .DS_Store
  # Dev artifacts accidentally committed in PR #25 — exclude from Jekyll build
  # so GitHub Pages can build successfully. A follow-up PR should `git rm`
  # these from the repo entirely.
  - scripts-staging
  - node_modules
  - app.js.pre-usvi-port
  - enrich-full.log
  - enrich-tours.js.bak-currency
  - package.json
  - package-lock.json
  - "tours-data.json.pre-*"
  - "*.bak"
  - "*.bak-*"
  - "*.pre-*"
  - "*.log"
permalink: /:path/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
keep_files:
  - blog
