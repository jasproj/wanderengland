markdown: kramdown
theme: null
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - .git
  - .gitignore
  - README.md
  - .DS_Store
  # Defensive: dev tooling dirs that should never be processed by Jekyll
  # even if accidentally committed.
  - scripts-staging
  - node_modules
permalink: /:path/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
keep_files:
  - blog
